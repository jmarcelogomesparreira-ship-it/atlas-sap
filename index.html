<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas SAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F4F1EA;--paper:#FFFDF8;--paper-2:#F8F5EE;--ink:#22252A;--ink-2:#45484E;--muted:#7A766D;--line:#E7E1D4;--line-2:#D8D0BF;
  --mm:#D9932B;--sd:#D9604A;--pp:#7468C9;--qm:#C9567F;--pm:#2A9483;--wm:#B07A4F;--ps:#4F86C6;--fi:#2C5F9E;--aa:#5F7FA3;--co:#3C9258;--hcm:#9A6BC4;--br:#5E8C3A;--ferr:#6B7079;
  --deb:#2F8F5B;--cre:#C24B3A;
  --shadow:0 1px 2px rgba(40,34,20,.05),0 2px 8px -4px rgba(40,34,20,.08);
  --shadow-hi:0 18px 40px -18px rgba(40,34,20,.28),0 4px 10px -4px rgba(40,34,20,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --serif:"Fraunces",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
:root[data-theme="dark"]{
  --bg:#131518;--paper:#1B1E22;--paper-2:#21252A;--ink:#ECE8DF;--ink-2:#C9C4B9;--muted:#948F84;--line:#2B2F35;--line-2:#3A3F46;
  --mm:#E9A845;--sd:#EA7A64;--pp:#9187E0;--qm:#E07399;--pm:#3FB5A2;--wm:#C99266;--ps:#6FA2E0;--fi:#5B8ED0;--aa:#7E9BBD;--co:#55B072;--hcm:#B48AD8;--br:#7FAE58;--ferr:#8D929B;
  --deb:#4FC07F;--cre:#F07A68;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-hi:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
code,.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}

/* topo */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px}
.mark i{border-radius:3px}
.mark i:nth-child(1){background:var(--mm)}.mark i:nth-child(2){background:var(--fi)}.mark i:nth-child(3){background:var(--co)}.mark i:nth-child(4){background:var(--sd)}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{font-size:11.5px;color:var(--muted)}
.find{margin-left:auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);color:var(--muted);font-size:14px;min-width:300px;transition:all .25s var(--ease)}
.find:hover{border-color:var(--ink-2);color:var(--ink);box-shadow:var(--shadow)}
.find kbd{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--paper-2)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--ink-2);border:1px solid var(--line-2);background:var(--paper);transition:all .25s var(--ease)}
.ibtn:hover{color:var(--ink);transform:rotate(-12deg)}
.burger{display:none}

/* índice */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - 65px)}
.toc{position:sticky;top:65px;height:calc(100vh - 65px);overflow-y:auto;padding:22px 16px 28px;border-right:1px solid var(--line)}
.toc h6{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:18px 12px 6px;font-weight:600}
.toc h6:first-child{margin-top:0}
.ti-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;font-size:14px;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s;position:relative;width:100%;text-align:left}
.ti-row:hover{background:var(--paper);color:var(--ink)}
.ti-row.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.ti-row .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.ti-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-row code{font-size:11px;font-weight:700;width:38px;flex-shrink:0;color:var(--muted)}
.ti-row.on code{color:var(--ink)}
.ti-row em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
.ti-row .pg{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
.ti-row>i.ti{font-size:17px;width:14px}

/* conteúdo */
.main{min-width:0;padding:34px 44px 60px;max-width:1360px}
.view{animation:vin .55s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:vin .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hero h1{font-size:46px;line-height:1.05;margin:8px 0 12px;letter-spacing:-.025em}
.hero p{font-size:17px;color:var(--ink-2);max-width:760px;margin:0}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:27px}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

/* mapa de metrô */
.metro{padding:18px 12px 8px;overflow-x:auto}
.metro svg{display:block;min-width:980px;width:100%;height:auto}
.metro .trk{fill:none;stroke-width:9;stroke-linecap:round;transition:opacity .35s}
.metro .stn{cursor:pointer}
.metro .stn circle{fill:var(--paper);stroke-width:4;transition:r .25s var(--ease)}
.metro .stn:hover circle{r:11}
.metro .stn text,.metro .xg text{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.metro .xg{cursor:pointer}
.metro .xg rect{fill:var(--paper);stroke:var(--ink);stroke-width:3;transition:all .25s}
.metro .xg:hover rect{fill:var(--paper-2);stroke-width:4}
.metro .lbl{cursor:pointer}
.metro .lbl rect{transition:all .25s}
.metro .lbl text{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;fill:#fff}
.metro g.ln{transition:opacity .35s}
.metro.iso g.ln:not(.on){opacity:.12}
.metro .stn.sel circle{stroke-width:6;r:12}
.metro-legend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 22px 20px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--paper-2);transition:all .25s var(--ease)}
.lg i{width:18px;height:6px;border-radius:6px}
.lg:hover,.lg.on{border-color:var(--ink-2);background:var(--paper)}
.lg-hint{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* módulos */
.fam{margin-top:22px}
.fam h3{font-family:Inter,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:600;margin-bottom:10px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{position:relative;text-align:left;padding:18px 18px 16px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.mod::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.mod:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
.mod .sig{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--c);letter-spacing:-.02em}
.mod b{display:block;font-family:var(--serif);font-size:18px;font-weight:600;margin:2px 0 6px}
.mod p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.mod .st{position:absolute;top:16px;right:14px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.mod .st.ok{background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--ink)}
.mod .st.soon{border:1px dashed var(--line-2);color:var(--muted)}
.mod .bar{height:5px;border-radius:5px;background:var(--paper-2);margin-top:12px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .8s var(--ease)}

/* capítulo */
.cover{position:relative;border-radius:26px;padding:38px 40px 34px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(1200px 300px at 100% 0,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%)}
.cover>*{position:relative}
.cover .big{position:absolute;right:34px;top:14px;font-family:var(--mono);font-weight:700;font-size:120px;line-height:1;color:color-mix(in srgb,var(--c) 30%,transparent);letter-spacing:-.05em;pointer-events:none}
.cover h1{font-size:44px;line-height:1.05;margin:10px 0 12px;max-width:760px}
.cover p{font-size:16.5px;color:var(--ink-2);max-width:720px;margin:0}
.cstats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap}
.cstats div b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1}
.cstats div small{font-size:12.5px;color:var(--muted)}
.prog{width:220px}
.prog .bar{height:8px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--c);transition:width .8s var(--ease)}

/* estrutura organizacional */
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:20px}
.ob{position:relative;border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:var(--paper-2)}
.ob .lv{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.ob b{display:block;font-family:var(--serif);font-size:18px;margin:2px 0}
.ob p{margin:0;font-size:12.5px;color:var(--ink-2)}
.ob .keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--ink);color:var(--paper);white-space:nowrap}
.chip.soft{background:var(--paper);color:var(--ink-2);border:1px solid var(--line-2)}
button.chip{cursor:pointer;transition:transform .2s var(--ease)}
button.chip:hover{transform:translateY(-1px)}
.ob .arr{position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.org-note{padding:0 20px 18px;font-size:13px;color:var(--muted);display:flex;gap:8px}

/* viagem do pedido */
.trip{padding:22px 24px 24px}
.trip-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:12px;font-size:13.5px;font-weight:600;background:var(--ink);color:var(--paper);transition:all .25s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hi)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line-2)}
.btn i{font-size:17px}
.trip-sum{margin-left:auto;font-size:12.5px;color:var(--muted)}
.rail{position:relative;margin:8px 18px 4px;height:86px}
.rail .tk{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:8px;background:var(--line-2)}
.rail .tk i{display:block;height:100%;width:0;border-radius:8px;background:var(--c,var(--mm));transition:width .9s var(--ease)}
.rail .sn{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.rail .sn span{width:30px;height:30px;margin-top:9px;border-radius:50%;background:var(--paper);border:4px solid var(--line-2);transition:all .4s var(--ease);display:grid;place-items:center;font-size:12px;color:#fff}
.rail .sn.done span{border-color:var(--c,var(--mm));background:var(--c,var(--mm))}
.rail .sn.cur span{border-color:var(--c,var(--mm));background:var(--paper);transform:scale(1.25);box-shadow:0 0 0 8px color-mix(in srgb,var(--c,var(--mm)) 22%,transparent)}
.rail .sn code{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--paper-2);border:1px solid var(--line);white-space:nowrap}
.rail .sn.cur code{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.train{position:absolute;top:13px;width:22px;height:22px;transform:translateX(-50%);transition:left .9s var(--ease);z-index:2;display:grid;place-items:center;color:var(--ink);font-size:20px}
.narr{display:flex;gap:14px;align-items:flex-start;margin:14px 0 18px;padding:16px 18px;border-radius:16px;background:var(--paper-2);border:1px solid var(--line);min-height:76px}
.narr .ic{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--c,var(--mm));display:grid;place-items:center;font-size:19px;flex-shrink:0}
.narr b{font-family:var(--serif);font-size:17px;display:block}
.narr p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.trip-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px}
.tp h4,.rz-wrap h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.tbls{display:flex;flex-wrap:wrap;gap:7px}
.tb{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:12px;font-weight:600;transition:all .4s var(--ease)}
.tb small{font-family:Inter;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:20px;background:var(--paper-2);color:var(--muted)}
.tb.hot{border-color:var(--mm);background:color-mix(in srgb,var(--mm) 14%,var(--paper));animation:pop .6s var(--ease)}
.tb.hot small{background:var(--mm);color:#fff}
.tb.upd{border-color:var(--ps);background:color-mix(in srgb,var(--ps) 12%,var(--paper));animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.tb-leg{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px}
.tb-leg span{display:flex;align-items:center;gap:5px}
.tb-leg i{width:10px;height:10px;border-radius:3px}
.rz{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.T{border-radius:14px;background:var(--paper);border:1px solid var(--line);padding:10px 12px 10px;transition:border-color .4s,box-shadow .4s}
.T.hot{border-color:var(--ink-2);box-shadow:var(--shadow-hi)}
.T>b{display:block;text-align:center;font-family:var(--serif);font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.T .cols{display:grid;grid-template-columns:1fr 1fr;min-height:58px}
.T .cols div{padding:6px 4px;display:flex;flex-direction:column;gap:3px}
.T .cols div:first-child{border-right:2px solid var(--ink)}
.T .cols span{font-family:var(--mono);font-size:11.5px;font-weight:600;animation:pop .6s var(--ease)}
.T .d span{color:var(--deb)}.T .c span{color:var(--cre);text-align:right}
.T .sal{margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.T .sal b{font-family:var(--mono);color:var(--ink)}
.T .sal.z b{color:var(--muted)}
.rz-note{font-size:12px;color:var(--muted);margin-top:10px}

/* tipos de movimento */
.mvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mv{padding:16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.mv-h{display:flex;align-items:center;gap:10px}
.mv-h code{font-size:20px;font-weight:700;color:var(--c)}
.mv-h b{font-size:14px}
.mv p{margin:6px 0 10px;font-size:13px;color:var(--ink-2)}
.dc{display:flex;flex-direction:column;gap:4px}
.dc div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.dc em{font-style:normal;font-size:10.5px;font-weight:700;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.dc .D em{background:var(--deb)}.dc .C em{background:var(--cre)}
.dc .none{color:var(--muted);font-size:12.5px}

/* determinação de contas */
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.chn{position:relative;border-radius:16px;border:1px solid var(--line);background:var(--paper-2);padding:14px 14px 12px}
.chn .n{position:absolute;top:-10px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.chn b{display:block;font-family:var(--serif);font-size:16px;margin:6px 0 6px}
.chn p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.chn .chip{white-space:normal;line-height:1.5}
.chn .ar{position:absolute;right:-13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted);z-index:1}
.detr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}
.dt code{font-size:17px;font-weight:700;color:var(--fi)}
.dt .dn{display:block;font-size:13px;font-weight:600;margin:2px 0 8px}
.dt .dc b{font-size:11.5px}
@media (max-width:900px){.chain{grid-template-columns:1fr 1fr}.chn .ar{display:none}}
/* transações */
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .25s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.srch{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);margin-left:auto}
.srch:focus-within{border-color:var(--ink-2)}
.srch input{border:0;outline:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);width:200px}
.srch i{color:var(--muted)}
.txs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.tx{position:relative;text-align:left;padding:16px 16px 14px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.tx::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
.tx:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:var(--line-2)}
.tx-h{display:flex;align-items:center;gap:8px}
.tx-h code{font-size:19px;font-weight:700;letter-spacing:-.02em}
.kind{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.kind.c{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
.kind.a{background:color-mix(in srgb,var(--cre) 14%,var(--paper));color:var(--cre)}
.tx b{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25}
.tx p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45;flex:1}
.tx .tbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tx .tbs span{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.tx .done{position:absolute;top:14px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--deb);color:#fff;display:grid;place-items:center;font-size:13px}
.tx.isdone .kind{margin-right:28px}
.grp-t{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin:10px 0 -2px;display:flex;align-items:center;gap:10px}
.grp-t::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}

/* tabelas */
.tabs-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tbc{text-align:left;padding:14px 15px;border-radius:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);transition:all .3s var(--ease)}
.tbc:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.tbc code{font-size:16px;font-weight:700;color:var(--c)}
.tbc p{margin:3px 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.tbc .k{font-size:11px;color:var(--muted)}
.tbc .k b{font-family:var(--mono);color:var(--ink-2);font-weight:600}

/* gaveta raio-x */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--paper);z-index:70;transform:translateX(104%);transition:transform .5s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.dr.on{transform:none}
.dr-band{height:6px;background:var(--c)}
.dr-h{padding:22px 28px 18px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,var(--paper)),var(--paper))}
.dr-h .eyebrow{display:flex;align-items:center;gap:8px}
.dr-h .eyebrow i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.dr-code{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.dr-name{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:2px}
.dr-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dr-x{position:absolute;top:18px;right:20px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:var(--muted);transition:all .3s var(--ease)}
.dr-x:hover{background:var(--paper-2);color:var(--ink);transform:rotate(90deg)}
.dr-b{flex:1;overflow-y:auto;padding:4px 28px 24px}
.ds{padding:18px 0 4px;opacity:0;transform:translateX(16px)}
.dr.on .ds{animation:sl .55s var(--ease) both;animation-delay:calc(140ms + var(--i)*55ms)}
@keyframes sl{to{opacity:1;transform:none}}
.ds h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.ds h4 i{font-size:15px}
.ds>p{margin:0;font-size:14.5px;color:var(--ink-2)}
.rows{display:flex;flex-direction:column;gap:6px}
.rw{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);text-align:left;width:100%;transition:all .25s var(--ease)}
button.rw:hover{border-color:var(--ink-2);transform:translateX(3px)}
.rw code{font-size:12.5px;font-weight:700;background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:7px;min-width:74px;text-align:center}
.rw span{font-size:13px;color:var(--ink-2);flex:1}
.rw .go{color:var(--muted);font-size:15px}
.reads{display:flex;flex-wrap:wrap;gap:6px}
.post{border-radius:14px;border:1px solid var(--line);overflow:hidden}
.post div{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:10px;padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
.post div:last-child{border-bottom:0}
.post em{font-style:normal;font-weight:700;font-size:11px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}
.post .D em{background:var(--deb)}.post .C em{background:var(--cre)}
.post small{color:var(--muted);font-size:12px;display:block}
.callout{display:flex;gap:10px;padding:13px 15px;border-radius:14px;background:color-mix(in srgb,var(--ps) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--ps) 30%,transparent);font-size:13.5px;color:var(--ink-2)}
.callout i{color:var(--ps);font-size:19px;flex-shrink:0}
.callout.tip{background:color-mix(in srgb,var(--mm) 10%,var(--paper));border-color:color-mix(in srgb,var(--mm) 30%,transparent)}
.callout.tip i{color:var(--mm)}
.fields{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fields div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.fields div:last-child{border-bottom:0}
.fields div:nth-child(odd){background:var(--paper-2)}
.fields code{font-weight:700;font-size:12.5px}
.fields .key code::after{content:" · chave";font-family:Inter;font-weight:600;font-size:10.5px;color:var(--mm)}
.dr-f{display:flex;gap:8px;padding:14px 28px;border-top:1px solid var(--line);background:var(--paper)}
.learn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line-2);transition:all .3s var(--ease)}
.learn .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;transition:all .3s var(--ease)}
.learn .ck i{font-size:13px;color:#fff;transform:scale(0);transition:transform .3s var(--ease)}
.learn.on{background:color-mix(in srgb,var(--deb) 12%,var(--paper));border-color:var(--deb);color:var(--deb)}
.learn.on .ck{background:var(--deb);border-color:var(--deb)}
.learn.on .ck i{transform:scale(1)}

/* busca */
.sk{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(20,18,14,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.sk.on{opacity:1;pointer-events:auto}
.sk-box{width:min(640px,92vw);border-radius:20px;background:var(--paper);box-shadow:var(--shadow-hi);border:1px solid var(--line);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease)}
.sk.on .sk-box{transform:none}
.sk-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sk-in i{font-size:20px;color:var(--muted)}
.sk-in input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--ink)}
.sk-res{max-height:52vh;overflow-y:auto;padding:8px}
.sk-r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;width:100%;text-align:left}
.sk-r.on{background:var(--paper-2)}
.sk-r code{min-width:96px;font-size:13px;font-weight:700}
.sk-r span{flex:1;font-size:14px;color:var(--ink-2)}
.sk-r small{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--paper))}
.sk-f{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sk-f kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2)}

/* em breve */
.soon{padding:44px;text-align:center}
.soon .big{font-family:var(--mono);font-size:80px;font-weight:700;color:var(--c);letter-spacing:-.04em;line-height:1}
.soon h2{font-size:30px;margin:12px 0 8px}
.soon p{color:var(--ink-2);max-width:560px;margin:0 auto 18px}
.soon .tbls{justify-content:center}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);z-index:90;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:56px;font-size:12.5px;color:var(--muted);display:flex;gap:8px}
.tipline{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center;margin-top:12px}


/* para estudar (cards do mapa) */
.study-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.study{position:relative;text-align:left;padding:22px 22px 20px;border-radius:20px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.study:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.study .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 16%,var(--paper));color:var(--c);margin-bottom:14px}
.study b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
.study p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.study .go{position:absolute;right:18px;top:22px;color:var(--muted);transition:transform .3s var(--ease)}
.study:hover .go{transform:translateX(4px);color:var(--ink)}
.study .mini{margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}

/* mapa das tabelas */
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:26px;align-items:start}
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.gq{position:relative}
.gq i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.gq input{height:38px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper-2);padding:0 12px 0 34px;font-family:var(--mono);font-size:13px;color:var(--ink);width:230px;outline:none;transition:border-color .2s}
.gq input:focus{border-color:var(--ink)}
.gleg{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.gleg span{display:flex;align-items:center;gap:6px}
.gleg i{width:18px;height:0;border-top:2.5px solid var(--ink-2);opacity:.75}
.gleg i.in{border-top-style:dotted}
.gstage{position:relative;height:600px;overflow:hidden;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c,var(--ink)) 7%,transparent),transparent 62%)}
.gstage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ge{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.7;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease),stroke-width .3s,opacity .3s}
.ge.on{stroke-dashoffset:0}
.ge.in{opacity:.55}
.ge.hl{stroke-width:5;opacity:1}
.gl{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .4s .55s}
.gl.on{opacity:1}
.gl.hl{fill:var(--ink);font-size:12px}
.gn{position:absolute;left:0;top:0;z-index:1;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:11px;background:var(--paper);border:1px solid var(--line-2);box-shadow:var(--shadow);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;cursor:pointer;transition:transform .8s var(--ease),opacity .45s,box-shadow .25s,border-color .25s,padding .4s var(--ease),font-size .4s var(--ease)}
.gn>i{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0}
.gn:hover{border-color:var(--c);box-shadow:var(--shadow-hi);z-index:3}
.gn small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;color:var(--muted);text-align:left}
.gn.ctr{z-index:2;padding:12px 18px 12px 14px;font-size:18px;border:2px solid var(--c);box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 15%,transparent),var(--shadow-hi)}
.gn.ctr>i{width:12px;height:12px}
.gn.nx{border-color:var(--ink);animation:gpulse 1.4s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.gempty{position:absolute;left:50%;top:calc(50% + 62px);transform:translateX(-50%);font-size:13px;color:var(--muted);text-align:center;width:80%}
.gpath{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--paper-2);border-radius:0 0 20px 20px}
.gpath.on{display:flex}
.gpath .chip{transition:all .3s var(--ease)}
.gpath .chip.cur{background:var(--c);color:#fff;transform:scale(1.08)}
.gpath .chip.past{opacity:.55}
.gpath .ar{color:var(--muted);font-size:13px}
.gpath .cap{flex-basis:100%;font-size:13px;color:var(--ink-2);margin-top:4px;min-height:20px}
.gpath .cap b{color:var(--ink)}
.paths{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:11px;font-size:12.5px;font-weight:600;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);transition:all .25s var(--ease)}
.pbtn:hover{transform:translateY(-1px);border-color:var(--ink)}
.pbtn.on{background:var(--ink);color:var(--paper)}
.pbtn i{font-size:15px}
.gside{padding:20px 20px 22px;position:sticky;top:84px}
.gside .code{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--c);margin:6px 0 4px;word-break:break-all}
.gside>p{margin:0 0 12px;font-size:14px;color:var(--ink-2);line-height:1.55}
.gside h5{margin:18px 0 8px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-family:Inter,sans-serif}
.gside .reads{display:flex;flex-wrap:wrap;gap:6px}
.gside .acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.gside .none{font-size:13px;color:var(--muted)}

/* trilha */
.tsum{display:flex;align-items:center;gap:18px;padding:18px 22px;margin-top:24px}
.tsum .ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--mm) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex-shrink:0;transition:--p .8s}
.tsum .ring b{width:50px;height:50px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:17px}
.tsum p{margin:0;font-size:14px;color:var(--ink-2)}
.tsum p b{color:var(--ink)}
.trail{margin-top:30px}
.tstep{display:grid;grid-template-columns:58px minmax(0,1fr);gap:18px;position:relative}
.tstep:before{content:'';position:absolute;left:27px;top:58px;bottom:0;width:4px;border-radius:4px;background:var(--line)}
.tstep:last-child:before{display:none}
.tstep.done:before{background:var(--c)}
.tnum{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600;background:var(--paper);border:3px solid var(--line-2);color:var(--ink);position:relative;z-index:1;transition:all .4s var(--ease)}
.tstep.part .tnum{border-color:var(--c);color:var(--c)}
.tstep.done .tnum{background:var(--c);border-color:var(--c);color:#fff}
.tcard{padding:20px 22px;margin-bottom:24px;border-left:4px solid var(--c)}
.tcard .eyebrow{color:var(--c)}
.tcard h3{font-size:22px;margin:4px 0 6px}
.tcard>p{margin:0 0 14px;font-size:14px;color:var(--ink-2);line-height:1.55;max-width:760px}
.tcard h5{margin:12px 0 7px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-family:Inter,sans-serif}
.tcard .reads{display:flex;flex-wrap:wrap;gap:6px}
.tcard .chip.st{background:color-mix(in srgb,var(--c) 22%,var(--paper));color:var(--ink)}
.tcard .chip.st:before{content:'✓';font-weight:800}
.tfoot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.tfoot .bar{flex:1;min-width:120px;height:6px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.tfoot .bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .8s var(--ease)}
.tfoot small{font-size:12.5px;color:var(--muted);font-weight:600}
.tfoot .best{font-size:12px;color:var(--muted)}

/* quiz */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;margin-top:26px;align-items:start}
.qz{padding:26px 28px 24px}
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.qtop small{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.qdots{display:flex;gap:5px;flex:1}
.qdots i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .35s}
.qdots i.cur{background:var(--ink-2)}
.qdots i.ok{background:#3C9258}
.qdots i.no{background:#C8553D}
.qtype{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.qq{font-family:var(--serif);font-size:25px;line-height:1.3;margin:6px 0 6px;font-weight:600}
.qq code{font-family:var(--mono);font-size:.9em;color:var(--c,var(--ink));font-weight:700}
.qsub{font-size:14px;color:var(--ink-2);margin:0 0 18px;line-height:1.55}
.qopts{display:grid;gap:10px;margin-top:16px}
.qo{display:flex;gap:13px;align-items:center;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--paper);font-size:14.5px;color:var(--ink);transition:all .25s var(--ease)}
.qo:hover:not([disabled]){border-color:var(--ink);transform:translateX(3px)}
.qo kbd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--paper-2);border:1px solid var(--line-2);color:var(--muted)}
.qo .t{flex:1;line-height:1.45}
.qo .t.mono{font-family:var(--mono);font-weight:700;font-size:14px}
.qo .t small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:12.5px;color:var(--muted)}
.qo[disabled]{cursor:default}
.qo.ok{border-color:#3C9258;background:color-mix(in srgb,#3C9258 12%,var(--paper))}
.qo.ok kbd{background:#3C9258;color:#fff;border-color:#3C9258}
.qo.no{border-color:#C8553D;background:color-mix(in srgb,#C8553D 10%,var(--paper));animation:shake .4s}
.qo.no kbd{background:#C8553D;color:#fff;border-color:#C8553D}
.qo.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.qexp{margin-top:18px;padding:15px 17px;border-radius:14px;background:var(--paper-2);border:1px solid var(--line);font-size:14px;color:var(--ink-2);line-height:1.55;animation:vin .45s var(--ease) both}
.qexp b.v{display:block;margin-bottom:4px;font-size:15px}
.qexp b.v.ok{color:#3C9258}.qexp b.v.no{color:#C8553D}
.qnav{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qnav .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.qside{padding:20px}
.qside label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.qside select{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);padding:0 10px;font-size:13.5px;font-family:Inter,sans-serif}
.qside .best{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.qside .best b{font-family:var(--serif);font-size:24px;display:block;color:var(--ink)}
.qside .tip{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.qscore{text-align:center;padding:10px 0 4px}
.qscore .big{font-family:var(--serif);font-size:74px;font-weight:600;line-height:1;letter-spacing:-.03em}
.qscore .big small{font-size:30px;color:var(--muted)}
.qscore h3{font-size:24px;margin:10px 0 6px}
.qscore p{margin:0 auto;color:var(--ink-2);font-size:14.5px;max-width:460px}
.qscore .rec{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 12px;border-radius:20px;background:color-mix(in srgb,var(--mm) 18%,var(--paper));font-size:12.5px;font-weight:700}
.qmiss{margin-top:22px;text-align:left}
.qmiss h5{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px;font-family:Inter,sans-serif}
.qmiss .rw{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;font-size:13.5px;width:100%;text-align:left;background:var(--paper);transition:border-color .2s}
.qmiss .rw:hover{border-color:var(--ink)}
.qmiss .rw span{flex:1;color:var(--ink-2)}
.qmiss .rw b{font-family:var(--mono)}
@media (max-width:1100px){.gwrap,.qwrap{grid-template-columns:1fr}.gside{position:static}}
@media (max-width:900px){
  .study-g{grid-template-columns:1fr}
  .gstage{height:480px}
  .gq input{width:100%}.gq{flex:1}
  .gleg{display:none}
  .gn{font-size:10.5px;padding:4px 8px 4px 7px;gap:5px}
  .gn.ctr{font-size:14px;padding:9px 12px}
  .gl{display:none}
  .tstep{grid-template-columns:40px minmax(0,1fr);gap:12px}
  .tnum{width:40px;height:40px;font-size:17px}
  .tstep:before{left:18px;top:40px}
  .tcard{padding:16px}
  .qz{padding:20px 18px}
  .qq{font-size:21px}
}
@media (max-width:1100px){.trip-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .toc{position:fixed;left:0;top:0;bottom:0;height:100vh;width:280px;z-index:65;background:var(--bg);transform:translateX(-102%);transition:transform .4s var(--ease);border-right:1px solid var(--line)}
  .toc.on{transform:none}
  .burger{display:grid}
  .main{padding:24px 18px 50px}
  .find{min-width:0;flex:1}
  .find span,.find kbd{display:none}
  .find{flex:0 0 40px;padding:0;justify-content:center}
  .top{padding:10px 16px}
  .hero h1,.cover h1{font-size:32px}
  .cover{padding:28px 22px}
  .cover .big{font-size:70px;right:14px}
  .srch{margin-left:0;width:100%}.srch input{width:100%}
  .dr-h,.dr-b,.dr-f{padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===================== ROTAS ===================== */
function route(){const h=decodeURIComponent((location.hash||'#mapa').slice(1));if(h.startsWith('mod:'))return {v:'mod',k:h.slice(4)};if(h==='tabelas'||h.startsWith('tabelas:'))return {v:'tabelas',k:h.slice(8)};if(h==='trilha')return {v:'trilha'};if(h==='quiz')return {v:'quiz'};return {v:'mapa'}}
function go(h){if(location.hash==='#'+h)render();else location.hash=h}
window.addEventListener('hashchange',render);
function render(){
  const r=route();closeToc();if(typeof trip!=='undefined'){clearTimeout(trip.timer);trip.timer=null}
  gStop();G.el={};
  const m=$('#main');
  if(r.v==='mod'){const mod=modOf(r.k);m.innerHTML=mod?(isReady(mod)?chapter(mod):soon(mod)):mapView()}
  else if(r.v==='tabelas')m.innerHTML=tablesView();
  else if(r.v==='trilha')m.innerHTML=trailView();
  else if(r.v==='quiz')m.innerHTML=quizView();
  else m.innerHTML=mapView();
  m.firstElementChild&&m.firstElementChild.classList.add('view');
  window.scrollTo({top:0});
  renderToc();
  if(r.v==='mapa')wireMap();
  if(r.v==='mod'&&TRIPS[r.k])wireTrip(r.k);
  wireTx();
  if(r.v==='tabelas')wireTables(TBM[r.k]?r.k:'EKPO');
  if(r.v==='trilha')wireTrail();
  if(r.v==='quiz')wireQuiz();
}

function metroSvg(){
  const X0=210,DX=96,Y0=56,DY=78,W=X0+DX*10+60,H=Y0+DY*(LINES.length-1)+56;
  const x=c=>X0+c*DX,y=i=>Y0+i*DY;
  const shared={};LINES.forEach((l,i)=>l.st.forEach(([c,col])=>{(shared[c]=shared[c]||{col,ls:[]}).ls.push(i)}));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de metrô dos processos SAP">`;
  s+=LINES.map((l,i)=>{
    const c=MC(l.m),a=l.st[0][1],b=l.st[l.st.length-1][1];
    const tw=l.n.length*7.4+30;
    let g=`<g class="ln" data-line="${l.k}"><g class="lbl" data-line="${l.k}"><rect x="${X0-tw-26}" y="${y(i)-14}" width="${tw}" height="28" rx="14" fill="${c}"/><text x="${X0-tw-26+15}" y="${y(i)+4.5}">${l.n}</text></g>`;
    g+=`<line class="trk" x1="${x(a)}" y1="${y(i)}" x2="${x(b)}" y2="${y(i)}" stroke="${c}"/>`;
    g+=l.st.filter(([cd])=>shared[cd].ls.length===1).map(([cd,col])=>`<g class="stn" data-tx="${cd}"><circle cx="${x(col)}" cy="${y(i)}" r="9" stroke="${c}"/><text x="${x(col)}" y="${y(i)+29}" text-anchor="middle">${cd}</text><title>${cd} · ${nameOf(cd)}</title></g>`).join('');
    return g+'</g>';
  }).join('');
  s+=Object.entries(shared).filter(([,v])=>v.ls.length>1).map(([cd,v])=>{
    const a=Math.min(...v.ls),b=Math.max(...v.ls);
    return `<g class="xg" data-tx="${cd}"><rect x="${x(v.col)-14}" y="${y(a)-14}" width="28" height="${y(b)-y(a)+28}" rx="14"/>${v.ls.map(i=>`<circle cx="${x(v.col)}" cy="${y(i)}" r="4.5" fill="var(--ink)"/>`).join('')}<text x="${x(v.col)}" y="${y(a)-22}" text-anchor="middle" style="font-size:13px;font-weight:700">${cd}</text><title>${cd} · ${nameOf(cd)} (baldeação)</title></g>`;
  }).join('');
  return s+'</svg>';
}
function nameOf(c){return TXM[c]?TXM[c].n:(PREV[c]?PREV[c][1]:'')}
function wireMap(){
  const m=$('#metro');let iso=null;
  const setIso=k=>{iso=iso===k?null:k;m.classList.toggle('iso',!!iso);m.querySelectorAll('g.ln').forEach(g=>g.classList.toggle('on',g.dataset.line===iso));document.querySelectorAll('.lg').forEach(b=>b.classList.toggle('on',b.dataset.line===iso))};

const fState={g:'Todas',k:'all',s:'all',q:''};
function wireTx(){
  const grid=$('#txGrid');
  document.querySelectorAll('#main [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('#main [data-tb]').forEach(b=>b.onclick=()=>openTb(b.dataset.tb));
  document.querySelectorAll('#main .tipline [data-tx]').forEach(b=>b.onclick=()=>openTx(b.dataset.tx));
  document.querySelectorAll('#main .soon [data-tx]').forEach(b=>b.onclick=()=>openTx(b.dataset.tx));
  document.querySelectorAll('[data-iso]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('atlas-iso',b.dataset.iso);go('mapa')});
  document.querySelectorAll('#main [data-quiz]').forEach(b=>b.onclick=()=>{try{sessionStorage.setItem('atlas-quiz-pool',b.dataset.quiz)}catch(_){}go('quiz')});
  if(!grid)return;
  const m=grid.dataset.mod,gs=['Todas',...new Set(txOf(m).map(t=>t.g))];
  Object.assign(fState,{g:'Todas',k:'all',s:'all',q:''});
  $('#fG').innerHTML=gs.map(g=>`<button data-g="${g}" class="${g==='Todas'?'on':''}">${g}</button>`).join('');
  const seg=(id,key)=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fState[key]=b.dataset[key];$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderTxGrid()});
  seg('#fG','g');seg('#fK','k');seg('#fS','s');

  grid.addEventListener('click',e=>{const c=e.target.closest('[data-tx]');if(c)openTx(c.dataset.tx)});

function renderTxGrid(){
  const grid=$('#txGrid');if(!grid)return;
  const m=grid.dataset.mod;
  const list=txOf(m).filter(t=>(fState.g==='Todas'||t.g===fState.g)&&(fState.k==='all'||t.k===fState.k)&&(fState.s==='all'||!studied[t.c])&&(!fState.q||(t.c+' '+t.n+' '+t.d+' '+t.w.map(w=>w[0]).join(' ')+' '+t.r.join(' ')).toLowerCase().includes(fState.q)));
  const groups=[...new Set(list.map(t=>t.g))];

}
function card(t,i){
  const tbs=[...t.w.map(w=>w[0]),...t.r].filter((v,k,a)=>a.indexOf(v)===k).slice(0,4);

/* ===================== VIAGEM DO PEDIDO ===================== */
let trip={i:-1,timer:null};
function wireTrip(k){
  const rail=$('#rail');if(!rail)return;
  TRIP=TRIPS[k].st;RZ=TRIPS[k].rz;RZQ=TRIPS[k].qty||false;
  trip={i:-1,timer:null};
  rail.innerHTML=`<div class="tk"><i id="tFill"></i></div><span class="train" id="train"><i class="ti ti-train"></i></span>`+TRIP.map((s,i)=>`<div class="sn" data-s="${i}" style="left:${i/(TRIP.length-1)*100}%"><span></span><code>${s.c}</code></div>`).join('');
  rail.querySelectorAll('.sn').forEach(n=>n.onclick=()=>{stopTrip();goStep(+n.dataset.s)});
  $('#tPlay').onclick=()=>trip.timer?stopTrip():playTrip();
  $('#tNext').onclick=()=>{stopTrip();goStep(Math.min(trip.i+1,TRIP.length-1))};
  $('#tReset').onclick=()=>{stopTrip();goStep(-1)};
  goStep(-1);
}
function playTrip(){if(trip.i>=TRIP.length-1)goStep(-1);$('#tPlay').innerHTML='<i class="ti ti-player-pause"></i><span>Pausar</span>';const tick=()=>{if(trip.i>=TRIP.length-1){stopTrip();return}goStep(trip.i+1);trip.timer=setTimeout(tick,2800)};trip.timer=setTimeout(tick,trip.i<0?200:900)}
function stopTrip(){clearTimeout(trip.timer);trip.timer=null;const b=$('#tPlay');if(b)b.innerHTML='<i class="ti ti-player-play"></i><span>'+(trip.i>=TRIP.length-1?'Rodar de novo':'Rodar')+'</span>'}
function goStep(i){
  if(!$('#tFill')){clearTimeout(trip.timer);trip.timer=null;return}
  trip.i=i;const pct=i<0?0:i/(TRIP.length-1)*100;
  $('#tFill').style.width=pct+'%';$('#train').style.left=pct+'%';
  document.querySelectorAll('#rail .sn').forEach((n,k)=>{n.classList.toggle('done',k<i);n.classList.toggle('cur',k===i)});
  const s=TRIP[i];
  $('#narr').innerHTML=i<0?`<div class="ic"><i class="ti ti-flag"></i></div><div><b>Tudo pronto para a viagem</b><p>Nenhuma tabela tem registro deste pedido e todos os razonetes estão zerados. Aperte "Rodar" ou clique numa estação.</p></div>`:`<div class="ic"><i class="ti ti-map-pin"></i></div><div><b><code style="font-size:14px">${s.c}</code> · ${s.t}</b><p>${s.p}</p></div>`;
  const cnt={},last={};
  TRIP.slice(0,i+1).forEach((st,k)=>st.tb.forEach(([t,a,q])=>{cnt[t]=(cnt[t]||0)+(a==='n'?(q||1):0);if(k===i)last[t]=a}));
  $('#tTbls').innerHTML=Object.keys(cnt).length?Object.keys(cnt).map(t=>`<button class="tb ${last[t]==='n'?'hot':last[t]==='u'?'upd':''}" data-tb="${t}" title="Abrir a ficha da ${t}">${t}<small>${cnt[t]||'↻'}</small></button>`).join(''):'<span style="color:var(--muted);font-size:13px">Nenhuma ainda.</span>';
  $('#tTbls').querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>openTb(b.dataset.tb));
  const led={};RZ.forEach(r=>led[r]={D:[],C:[],hot:false});
  TRIP.slice(0,i+1).forEach((st,k)=>st.ps.forEach(([a,dc,v])=>{led[a][dc].push(v);if(k===i)led[a].hot=true}));
  $('#tRz').innerHTML=RZ.map(a=>{const L=led[a],sd=L.D.reduce((x,y)=>x+y,0)-L.C.reduce((x,y)=>x+y,0);return `<div class="T ${L.hot?'hot':''}"><b>${a}</b><div class="cols"><div class="d">${L.D.map(v=>`<span>${nf(v)}</span>`).join('')}</div><div class="c">${L.C.map(v=>`<span>${nf(v)}</span>`).join('')}</div></div><div class="sal ${sd===0?'z':''}">${RZQ?'Ficou':'Saldo'} <b>${sd===0?'zero':RZQ?nf(sd)+' '+RZQ:(sd>0?'D ':'C ')+nf(Math.abs(sd))}</b></div></div>`}).join('');
  if(i>=TRIP.length-1)stopTrip();
}

function gNb(c,force){

function gLayout(){

  const rx=W/2-(sm?52:95),ry=H/2-(sm?34:44),two=n>11;
  G.pos={};G.pos[G.c]=[cx,cy];
  G.nb.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(n,1),f=two&&i%2?.64:1;G.pos[v.t]=[cx+Math.cos(a)*rx*f,cy+Math.sin(a)*ry*f]});
}

   mod:()=>{if(!P.all)return null;const t=pick(TX.filter(x=>x.m!=='FERR'));const d=distract(modOf(t.m).n,[],MODS.filter(m=>m.k!=='FERR').map(m=>m.n));
     return {k:'md'+t.c,ty:'Qual módulo',m:t.m,q:`De qual módulo é a <code>${t.c}</code>?`,sub:t.n,o:[[modOf(t.m).n,1],...d.map(v=>[v,0])],ex:`A ${t.c} é do módulo ${modOf(t.m).n} (${t.m}), no grupo “${t.g}”.`,ref:['tx',t.c]}},
   post:()=>{const yes=P.tx.filter(t=>Array.isArray(t.ct)),sm=TX.filter(x=>Array.isArray(x.ct)&&x.m===P.m),t=pick(yes.length?yes:sm.length?sm:TX.filter(x=>Array.isArray(x.ct)));
     const d=distract(t.c,P.tx.filter(noPost).map(x=>x.c),TX.filter(x=>noPost(x)&&x.m===t.m).map(x=>x.c).concat(TX.filter(noPost).map(x=>x.c)));
     return {k:'ps'+t.c,ty:'Na contabilidade',m:t.m,q:`Qual destas transações gera lançamento contábil?`,sub:'As outras gravam dados, mas não lançam nada no razão.',o:[[t.c,1],...d.map(v=>[v,0])],mono:1,names:1,ex:`A <b>${t.c}</b> lança: ${t.ct.map(r=>`${r[0]==='D'?'débito':'crédito'} em ${r[1]}`).join('; ')}.`,ref:['tx',t.c]}},
   key:()=>{const c=P.tb.filter(t=>keyOf(t));if(!c.length)return null;const t=pick(c),k=keyOf(t);const d=distract(k,nearTb(t).map(keyOf),TB.map(keyOf));
     return {k:'ky'+t.t,ty:'Chave da tabela',m:t.m,q:`Qual é a chave da <code>${t.t}</code>?`,sub:t.d,o:[[k,1],...d.map(v=>[v,0])],mono:1,ex:`A chave da ${t.t} é <b class="mono">${k}</b>: é por esses campos que você filtra na SE16N para achar um registro.`,ref:['tb',t.t]}}};
  const W=['desc','desc','writes','writes','tbdesc','kind','post','key','key'].concat(P.all?['mod','mod']:[]);
  const out=[],seen=new Set();let g=0;
  while(out.length<10&&g++<400){const q=G[pick(W)]();if(!q||seen.has(q.k)||q.o.length<2)continue;seen.add(q.k);q.o=shuffle(q.o);out.push(q)}
  return out;
}
function quizView(){
  const opts=`<optgroup label="Atlas"><option value="all">Todo o Atlas</option></optgroup><optgroup label="Módulos">${MODS.map(m=>`<option value="m:${m.k}">${m.n}</option>`).join('')}</optgroup><optgroup label="Trilha de estudo">${TRAIL.map((s,i)=>`<option value="t:${i}">Etapa ${i+1} · ${s.n}</option>`).join('')}</optgroup>`;
  return `<div>
  <div class="hero rise"><div class="eyebrow">Atlas · Para estudar</div><h1>Quiz</h1><p>Dez perguntas geradas na hora a partir do próprio Atlas, então cada rodada é diferente. Errou? A explicação mostra o porquê e abre o raio-X ou a ficha da tabela.</p></div>
  <div class="qwrap rise" style="--i:2"><div class="card qz" id="qz"></div>
  <div class="card qside"><label for="qPool">Assunto</label><select id="qPool">${opts}</select><div class="best" id="qBest"></div>
   <button class="btn ghost" id="qNew" style="margin-top:14px;width:100%;justify-content:center"><i class="ti ti-refresh"></i>Nova rodada</button>
   <div class="tip"><i class="ti ti-keyboard"></i> Responda com as teclas 1 a 4 e avance com Enter.</div></div></div></div>`;
}
function qStart(p){
  Q.pool=p;const P=poolOf(p);Q.qs=genQ(P);Q.i=0;Q.ans=[];Q.done=false;
  $('#qPool').value=p;const b=qBest(p);
  $('#qBest').innerHTML=b!==undefined?`Seu melhor em <i>${P.n}</i><b>${b}/10</b>`:`Primeira rodada em <i>${P.n}</i>.`;
  qDraw();
}
function qDraw(){
  const z=$('#qz');if(!z)return;
  if(Q.done)return qScore();
  const q=Q.qs[Q.i],a=Q.ans[Q.i],L='1234';
  z.style.setProperty('--c',MC(q.m));
  const dots=Q.qs.map((x,i)=>`<i class="${i<Q.ans.length?(x.o[Q.ans[i]][1]?'ok':'no'):i===Q.i?'cur':''}"></i>`).join('');
  const nm=v=>q.names&&TXM[v]?`<small>${TXM[v].n}</small>`:'';
  let s=`<div class="qtop"><small>${Q.i+1} de ${Q.qs.length}</small><div class="qdots">${dots}</div></div>
  <div class="qtype">${q.ty} · ${modOf(q.m).n}</div><div class="qq">${q.q}</div>${q.sub?`<p class="qsub">${q.sub}</p>`:''}
  <div class="qopts">${q.o.map((o,i)=>{let c='';if(a!==undefined){c=o[1]?'ok':i===a?'no':'dim'}return `<button class="qo ${c}" data-qo="${i}" ${a!==undefined?'disabled':''}><kbd>${L[i]}</kbd><span class="t ${q.mono?'mono':''}">${o[0]}${nm(o[0])}</span></button>`}).join('')}</div>`;
  if(a!==undefined){const ok=q.o[a][1];
    s+=`<div class="qexp"><b class="v ${ok?'ok':'no'}">${ok?pick(['Isso mesmo.','Certinho.','Na mosca.','Exato.']):pick(['Quase.','Não foi dessa vez.','Ainda não.'])}</b>${q.ex}</div>
    <div class="qnav"><button class="btn" id="qNext">${Q.i<Q.qs.length-1?'Próxima<i class="ti ti-arrow-right"></i>':'Ver resultado<i class="ti ti-trophy"></i>'}</button><button class="btn ghost" id="qRef"><i class="ti ${q.ref[0]==='tx'?'ti-scan':'ti-file-database'}"></i>${q.ref[0]==='tx'?'Raio-X da '+q.ref[1]:'Ficha da '+q.ref[1]}</button><span class="hint">Enter para continuar</span></div>`}
  z.innerHTML=s;
  z.querySelectorAll('[data-qo]').forEach(b=>b.onclick=()=>qAnswer(+b.dataset.qo));
  if(a!==undefined){$('#qNext').onclick=qNext;$('#qRef').onclick=()=>q.ref[0]==='tx'?openTx(q.ref[1]):openTb(q.ref[1])}
}
function qAnswer(i){if(Q.done||Q.ans[Q.i]!==undefined||!Q.qs[Q.i].o[i])return;Q.ans[Q.i]=i;qDraw()}
function qNext(){if(Q.ans[Q.i]===undefined)return;if(Q.i<Q.qs.length-1){Q.i++;qDraw()}else{Q.done=true;qScore()}}
function qScore(){
  const P=poolOf(Q.pool),n=Q.qs.filter((q,i)=>q.o[Q.ans[i]][1]).length,tot=Q.qs.length;
  let best={};try{best=JSON.parse(localStorage.getItem('atlas-quiz')||'{}')}catch(_){}
  const rec=best[Q.pool]===undefined||n>best[Q.pool];if(rec){best[Q.pool]=n;try{localStorage.setItem('atlas-quiz',JSON.stringify(best))}catch(_){}}
  $('#qBest').innerHTML=`Seu melhor em <i>${P.n}</i><b>${best[Q.pool]}/10</b>`;
  const msg=n===tot?['Gabaritou.','Você domina este assunto. Que tal outro módulo?']:n>=8?['Muito bom.','Faltou pouco. Reveja os itens abaixo e tente de novo.']:n>=5?['Bom caminho.','A base está aí. Os raio-X dos erros abaixo ajudam a fechar as lacunas.']:['Hora de revisar.','Passe pela trilha e pelos raio-X abaixo, depois volte para uma nova rodada.'];
  const miss=Q.qs.map((q,i)=>[q,i]).filter(([q,i])=>!q.o[Q.ans[i]][1]);
  $('#qz').style.setProperty('--c','var(--co)');
  $('#qz').innerHTML=`<div class="qscore"><div class="big">${n}<small>/${tot}</small></div><h3>${msg[0]}</h3><p>${msg[1]}</p>${rec&&n>0?'<span class="rec"><i class="ti ti-trophy"></i>Novo recorde neste assunto</span>':''}</div>
   ${miss.length?`<div class="qmiss"><h5>Para revisar</h5>${miss.map(([q])=>`<button class="rw" data-ref="${q.ref[0]}:${q.ref[1]}"><b>${q.ref[1]}</b><span>${q.q.replace(/<[^>]+>/g,'')}</span><i class="ti ti-chevron-right"></i></button>`).join('')}</div>`:''}
   <div class="qnav" style="justify-content:center"><button class="btn" id="qAgain"><i class="ti ti-refresh"></i>Nova rodada</button><button class="btn ghost" data-go2="trilha"><i class="ti ti-route-2"></i>Ir para a trilha</button></div>`;
  $('#qAgain').onclick=()=>qStart(Q.pool);
  $('#qz').querySelector('[data-go2]').onclick=()=>go('trilha');
  $('#qz').querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const [ty,c]=b.dataset.ref.split(/:(.+)/);ty==='tx'?openTx(c):openTb(c)});
}
function wireQuiz(){
  let p='all';try{p=sessionStorage.getItem('atlas-quiz-pool')||'all';sessionStorage.removeItem('atlas-quiz-pool')}catch(_){}
  $('#qPool').onchange=e=>qStart(e.target.value);
  $('#qNew').onclick=()=>qStart($('#qPool').value);
  qStart(p);
}
document.addEventListener('keydown',e=>{
  if(route().v!=='quiz'||!$('#qz')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/input|textarea|select/i.test(document.activeElement.tagName)||$('#sk').classList.contains('on')||$('#dr').classList.contains('on'))return;
  if(/^[1-4]$/.test(e.key)&&!Q.done){qAnswer(+e.key-1)}
  else if(e.key==='Enter'&&!Q.done&&Q.ans[Q.i]!==undefined){e.preventDefault();qNext()}
});

/* ===================== BUSCA ===================== */
const IDX=[...TX.map(t=>({c:t.c,n:t.n,m:t.m,ty:'Transação',a:()=>openTx(t.c),s:(t.c+' '+t.n+' '+t.d).toLowerCase()})),
 ...Object.entries(PREV).map(([c,v])=>({c,n:v[1],m:v[0],ty:'Prévia',a:()=>openTx(c),s:(c+' '+v[1]).toLowerCase()})),
 ...TB.map(t=>({c:t.t,n:t.d,m:t.m,ty:'Tabela',a:()=>openTb(t.t),s:(t.t+' '+t.d+' '+t.f.map(f=>f[0]+' '+f[1]).join(' ')).toLowerCase()})),
 ...MODS.map(m=>({c:m.k==='FERR'?'Kit':m.k,n:m.n,m:m.k,ty:'Módulo',a:()=>go('mod:'+m.k),s:(m.k+' '+m.n+' '+m.d).toLowerCase()})),
 {c:'Mapa',n:'Mapa das tabelas',m:'FI',ty:'Estudo',a:()=>go('tabelas'),s:'mapa das tabelas ligações grafo'},{c:'Trilha',n:'Trilha de estudo',m:'MM',ty:'Estudo',a:()=>go('trilha'),s:'trilha de estudo etapas'},{c:'Quiz',n:'Quiz do Atlas',m:'CO',ty:'Estudo',a:()=>go('quiz'),s:'quiz teste perguntas'},
 ...LINES.map(l=>({c:'Linha',n:l.n,m:l.m,ty:'Processo',a:()=>{sessionStorage.setItem('atlas-iso',l.k);go('mapa')},s:('linha processo '+l.n).toLowerCase()}))];
let skSel=0,skList=[];
function openSk(){$('#sk').classList.add('on');$('#skQ').value='';skSearch('');$('#skQ').focus()}
function closeSk(){$('#sk').classList.remove('on')}
function skSearch(q){
  q=q.trim().toLowerCase();
  const score=it=>{const c=it.c.toLowerCase();if(!q)return 1;if(c===q)return 100;if(c.startsWith(q))return 60;if(it.s.includes(q))return 20+(it.ty==='Transação'?5:0);return 0};
  skList=IDX.map(it=>[score(it),it]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,q?14:10).map(x=>x[1]);
  if(!q)skList=IDX.filter(i=>['MIGO','MIRO','ME21N','SE16N','EKPO','ACDOCA','MATDOC','EKBE'].includes(i.c)).slice(0,8);
  skSel=0;drawSk();
}
function drawSk(){
  $('#skR').innerHTML=skList.length?skList.map((it,i)=>`<button class="sk-r ${i===skSel?'on':''}" data-i="${i}" style="--c:${MC(it.m)}"><code>${it.c}</code><span>${it.n}</span><small>${it.ty}</small></button>`).join(''):`<div style="padding:22px;text-align:center;color:var(--muted)">Nada encontrado. Tente o código (MIGO) ou uma palavra (estoque).</div>`;
  $('#skR').querySelectorAll('.sk-r').forEach(b=>b.onclick=()=>{closeSk();skList[+b.dataset.i].a()});
  const on=$('#skR .sk-r.on');on&&on.scrollIntoView({block:'nearest'});
}
$('#skQ').addEventListener('input',e=>skSearch(e.target.value));
$('#skQ').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();skSel=Math.min(skSel+1,skList.length-1);drawSk()}
  else if(e.key==='ArrowUp'){e.preventDefault();skSel=Math.max(skSel-1,0);drawSk()}
  else if(e.key==='Enter'&&skList[skSel]){closeSk();skList[skSel].a()}
});
$('#sk').addEventListener('click',e=>{if(e.target.id==='sk')closeSk()});
$('#findBtn').onclick=openSk;
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSk()}
  else if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openSk()}
  else if(e.key==='Escape'){if($('#sk').classList.contains('on'))closeSk();else{closeDr();closeToc()}}
});

/* ===================== TEMA E MENU ===================== */
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeIc').className='ti '+(t==='dark'?'ti-sun':'ti-moon');try{localStorage.setItem('atlas-tema',t)}catch(_){}}
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
try{const t=localStorage.getItem('atlas-tema');if(t)setTheme(t)}catch(_){}
function closeToc(){$('#toc').classList.remove('on');if(!$('#dr').classList.contains('on'))$('#scrim').classList.remove('on')}
$('#burger').onclick=()=>{$('#toc').classList.add('on');$('#scrim').classList.add('on')};
$('#toc').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#home').onclick=()=>go('mapa');

render();
</script>
